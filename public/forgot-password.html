<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password — Gatenix</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <a class="auth-logo" href="/" id="logo">Gatenix</a>
    <div class="auth-card">
      <h1>Forgot password</h1>
      <p class="auth-sub">Enter your username or email and we'll help you recover access.</p>
      <div class="alert alert-ok" id="ok"></div>
      <form id="form">
        <div class="field">
          <label for="username">Username or Email</label>
          <input class="input" id="username" placeholder="Enter your username or email" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Send recovery link</button>
      </form>
      <div class="auth-foot"><a href="/sign-in">Back to sign in</a></div>
    </div>
  </div>
</div>
<script src="/assets/app.js"></script>
<script>
document.getElementById("logo").insertAdjacentHTML("afterbegin", nx.logoSVG);
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  // Self-hosted build has no email service configured by default.
  const ok = document.getElementById("ok");
  ok.textContent = "If this deployment has an email service configured, a recovery link was sent. Otherwise contact your administrator to reset your password.";
  ok.classList.add("show");
});
</script>
</body>
</html>
