<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Gatenix</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <a class="auth-logo" href="/" id="logo">Gatenix</a>
    <div class="auth-card">
      <h1>Sign in</h1>
      <p class="auth-sub">Don't have an account? <a href="/sign-up">Sign up</a>.</p>
      <div class="alert alert-error" id="alert"></div>
      <form id="form">
        <div class="field">
          <label for="username">Username or Email</label>
          <input class="input" id="username" placeholder="Enter your username or email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Sign in</button>
      </form>
      <div id="socialWrap"></div>
      <div class="auth-foot"><a href="/forgot-password">Forgot password?</a></div>
    </div>
    <div class="auth-foot" style="margin-top:1.5rem">
      <button class="btn btn-ghost btn-sm" data-theme-toggle>
        <svg data-theme-icon="dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg data-theme-icon="light" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Toggle theme
      </button>
    </div>
  </div>
</div>
<script src="/assets/app.js"></script>
<script>
document.getElementById("logo").insertAdjacentHTML("afterbegin", nx.logoSVG);
const params = new URLSearchParams(location.search);
const redirect = params.get("redirect") || "/dashboard";
const alertEl = document.getElementById("alert");
if (params.get("oauth_error")) {
  alertEl.textContent = params.get("oauth_error");
  alertEl.classList.add("show");
}
(async () => {
  try {
    const p = await nx.api("/api/auth/providers");
    if (!p.github && !p.google) return;
    const gh = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.53-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.78 1.05.78 2.12v3.14c0 .3.2.66.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>`;
    const gg = `<svg width="16" height="16" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5.04c1.72 0 3.26.59 4.47 1.75l3.32-3.32C17.78 1.57 15.11.5 12 .5 7.42.5 3.44 3.02 1.39 6.74l3.88 3.01C6.24 6.9 8.88 5.04 12 5.04Z"/><path fill="#4285F4" d="M23.49 12.27c0-.85-.08-1.67-.22-2.46H12v4.65h6.46c-.28 1.5-1.13 2.77-2.4 3.62l3.75 2.91c2.19-2.02 3.68-5 3.68-8.72Z"/><path fill="#FBBC05" d="M5.27 14.25a7.13 7.13 0 0 1 0-4.5L1.39 6.74a11.5 11.5 0 0 0 0 10.52l3.88-3.01Z"/><path fill="#34A853" d="M12 23.5c3.11 0 5.72-1.02 7.62-2.78l-3.75-2.91c-1.04.7-2.37 1.11-3.87 1.11-3.12 0-5.76-1.86-6.73-4.67l-3.88 3.01C3.44 20.98 7.42 23.5 12 23.5Z"/></svg>`;
    let html = '<div class="social-divider"><span>or continue with</span></div><div class="social-row">';
    if (p.github) html += `<a class="btn btn-social" href="/api/auth/github">${gh} GitHub</a>`;
    if (p.google) html += `<a class="btn btn-social" href="/api/auth/google">${gg} Google</a>`;
    html += "</div>";
    document.getElementById("socialWrap").innerHTML = html;
  } catch (e) {}
})();
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  alertEl.classList.remove("show");
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    await nx.api("/api/auth/signin", { method: "POST", body: {
      username: document.getElementById("username").value.trim(),
      password: document.getElementById("password").value,
    }});
    location.href = redirect;
  } catch (err) {
    alertEl.textContent = err.message;
    alertEl.classList.add("show");
    btn.disabled = false; btn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
